[project]
name = "ableton-mcp"
version = "0.1.0"
description = "Claude's MCP server for Ableton Live 12, through the ClaudeLiveBridge Remote Script (from LiveBridge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
]

[project.scripts]
ableton-mcp = "ableton_mcp.server:main"
livebridge = "livebridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ableton_mcp", "livebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
